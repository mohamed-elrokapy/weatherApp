<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section>
      <div class="main">
        <h1 class="city_country"></h1>
        <h1 class="time"></h1>
        <input
          type="text"
          class="city_input"
          placeholder=" enter your city here" />
        <button>show</button>
        <h1 class="not_valid_city"></h1>
        <div class="clouds">
          <img class="icon" src="" alt="" />
          <span class="clouds_description"></span>
        </div>
        <h1 class="heat_degree"></h1>
        <h1 class="additional_information_tittle tittle">
          additional information
        </h1>
        <div class="additional_information">
          <div class="windspeed">
            <h1 class="additional_information_tittle">wind speed</h1>
            <h1 class="wind_degree"></h1>
          </div>
          <div class="humidity">
            <h1 class="additional_information_tittle">humidity</h1>
            <h1 class="humidity_degree"></h1>
          </div>
          <div class="pressure">
            <h1 class="additional_information_tittle">pressure</h1>
            <h1 class="pressure_degree"></h1>
          </div>
        </div>
      </div>
    </section>

    <script src="main.js"></script>
  </body>
</html>
