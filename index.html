<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Current weather for any city: temperature, conditions, wind, humidity and pressure." />
    <meta name="theme-color" content="#1d4e7a" />
    <title>Weather</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-sky="idle">
    <main>
      <h1 class="title">Weather</h1>

      <form id="search" class="search" role="search" novalidate>
        <label for="city" class="visually-hidden">City</label>
        <input
          id="city"
          name="city"
          type="search"
          placeholder="Search a city, e.g. Tunis"
          autocomplete="off"
          autocapitalize="words"
          spellcheck="false"
          aria-describedby="city-error" />
        <button type="submit" id="submit">Search</button>
        <p class="field-error" id="city-error" role="alert"></p>
      </form>

      <section class="card" id="card" data-state="idle" aria-live="polite" aria-busy="false" aria-label="Current weather">
        <div id="card-body"></div>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="main.js"></script>
  </body>
</html>
